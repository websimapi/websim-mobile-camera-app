<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mobile Camera App</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
    {
        "imports": {
        }
    }
    </script>
</head>
<body>
    <div class="container">
        <h1>Camera Fun!</h1>

        <div class="controls">
            <button id="startCameraBtn">Start Camera</button>
        </div>

        <div class="media-display">
            <video id="videoElement" playsinline autoplay muted></video>
            <canvas id="canvasElement" style="display:none;"></canvas>
        </div>

        <div class="capture-controls">
            <button id="takePictureBtn" disabled>Take Picture</button>
            <button id="startRecordBtn" disabled>Start Recording</button>
            <button id="stopRecordBtn" disabled>Stop Recording</button>
        </div>
        
        <div class="output">
            <h2>Captured Media</h2>
            <div id="imageOutput">
                <p>Last Picture Taken:</p>
                <img id="imgElement" alt="Captured Picture">
            </div>
            <div id="videoOutput">
                <p>Last Video Recorded:</p>
                <!-- Recorded video will be playable here or downloadable -->
            </div>
            <div id="downloadLinks">
                <!-- Download links will appear here -->
            </div>
        </div>
    </div>

    <script src="script.js" type="module"></script>

</body>
</html>
